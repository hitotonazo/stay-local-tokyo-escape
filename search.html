<script>
(function(){
  function applyModeToLinks() {
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'favorite';
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || href.startsWith('javascript:') || href.startsWith('#')) return;
      if (!href.startsWith('./') && !href.startsWith('/')) return;
      const url = new URL(href, location.origin);
      url.searchParams.set('mode', mode);
      a.setAttribute('href', url.pathname + '?' + url.searchParams.toString());
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyModeToLinks);
  } else {
    applyModeToLinks();
  }
})();
</script>

<script>if(window.applyCurrentModeToLinks){window.applyCurrentModeToLinks(document);}</script>
